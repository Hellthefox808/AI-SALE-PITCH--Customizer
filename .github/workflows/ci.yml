name: PitchCraft Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-matrix:
    name: Code Quality & Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Backend — Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Backend — Standard JS Lint Verification
        run: |
          cd backend
          npm run lint

      - name: Backend — Run 40-Step Automated Test Suite
        run: |
          cd backend
          npm test

      - name: Frontend — Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend — Standard JS Lint Verification
        run: |
          cd frontend
          npm run lint

      - name: Frontend — Vite Production Bundle Compilation
        run: |
          cd frontend
          npm run build

  container-build-check:
    name: Multi-Stage Production Container Build Check
    runs-on: ubuntu-latest
    needs: quality-matrix
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: pitchcraft-ai:ci-test
