apiVersion: apps/v1
kind: Deployment
metadata:
  name: pitchcraft-ai
  namespace: default
  labels:
    app: pitchcraft-ai
    tier: application
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pitchcraft-ai
  template:
    metadata:
      labels:
        app: pitchcraft-ai
        tier: application
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: pitchcraft-ai
          image: pitchcraft-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pitchcraft-secrets
                  key: jwt-secret
                  optional: true
            - name: DB_PATH
              value: "/app/data/sales_pitch.db"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: pitchcraft-storage
              mountPath: /app/data
      volumes:
        - name: pitchcraft-storage
          emptyDir: {}
