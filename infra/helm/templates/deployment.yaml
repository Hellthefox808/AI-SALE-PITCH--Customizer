apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pitchcraft
  labels:
    app: {{ .Release.Name }}-pitchcraft
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-pitchcraft
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-pitchcraft
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: pitchcraft-ai
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          env:
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: DB_PATH
              value: {{ .Values.env.DB_PATH | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /app/data
      volumes:
        - name: storage
          emptyDir: {}
