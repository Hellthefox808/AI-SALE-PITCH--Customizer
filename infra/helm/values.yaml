replicaCount: 2

image:
  repository: pitchcraft-ai
  pullPolicy: IfNotPresent
  tag: "1.1.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 4000

env:
  NODE_ENV: "production"
  PORT: "4000"
  DB_PATH: "/app/data/sales_pitch.db"

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /api/health/live
    port: 4000
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health/ready
    port: 4000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 2

