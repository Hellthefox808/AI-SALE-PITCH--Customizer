services:
  pitchcraft-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pitchcraft-ai
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=production-secure-jwt-secret-replace-with-env
      - DB_PATH=/app/data/sales_pitch.db
    volumes:
      - pitchcraft-storage:/app/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pitchcraft-storage:
    driver: local

